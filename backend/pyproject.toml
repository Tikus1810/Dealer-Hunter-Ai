[project]
name = "deal-hunter-ai-backend"
version = "0.1.0"
description = "Deal Hunter AI - FastAPI backend (Clean Architecture)"
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `Depends(...)`/`Query(...)`/etc. as argument defaults is the
# framework's own idiom, not the mutable-default-argument bug B008 flags.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
exclude = ["alembic/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"
markers = ["integration: requires a live PostgreSQL database (see tests/integration/conftest.py)"]

[tool.coverage.run]
branch = true
source = ["app"]
