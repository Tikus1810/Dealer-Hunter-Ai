version: 2

# Weekly, not daily — this is a solo/small-team project; a flood of PRs
# nobody reviews for days is worse than one batched week. Version-pinned
# `requirements.txt`/`pubspec.yaml` (see backend/README.md and mobile/
# README.md for why both deliberately pin exact versions) mean these PRs
# are the intended mechanism for moving those pins forward deliberately,
# reviewed one at a time, rather than floating ranges that silently drift.
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Added once real: mobile/pubspec.yaml's pins were unverified when this
  # file was first written (no Flutter SDK in that sandbox) — deferred
  # then specifically to avoid compounding that risk with automated PRs
  # against pins nobody had confirmed actually worked. Since resolved:
  # CI's `flutter` job (pub get/analyze/test) has run against these pins
  # for real, repeatedly, across several fix rounds (see CLAUDE.md /
  # docs/branding.md's CI-verification notes) — safe to enable now.
  - package-ecosystem: pub
    directory: /mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
