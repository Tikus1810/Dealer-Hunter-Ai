name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dealhunter
          POSTGRES_PASSWORD: dealhunter
          POSTGRES_DB: dealhunter
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dealhunter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://dealhunter:dealhunter@localhost:5432/dealhunter
      DATABASE_URL_SYNC: postgresql+psycopg2://dealhunter:dealhunter@localhost:5432/dealhunter
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-test-secret
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy app scripts tests

      - name: Dependency vulnerability scan (pip-audit)
        # Band 14: Security-Härtung. Every finding here must be either
        # fixed (a safe bump — done for python-jose/python-multipart/lxml/
        # Pillow in Task #15, see requirements.txt and docs/security.md's
        # changelog) or explicitly ignored below with a documented reason,
        # never silently swallowed. Currently accepted, tracked risk (full
        # detail in docs/security.md "Known gaps" — re-check periodically,
        # this list is a snapshot, not a permanent exemption):
        #   - starlette 0.41.3 (PYSEC-2026-161/248/249/1941/1942/2280/2281):
        #     fixed versions need FastAPI >=0.116, a framework major-version
        #     bump that deserves its own dedicated regression pass, not a
        #     drive-by change inside a dependency-scanning task.
        #   - pytest 8.3.4 (PYSEC-2026-1845): fixed in 9.x, which needs a
        #     coordinated bump of pytest-asyncio (0.25 -> 1.x, confirmed
        #     incompatible with pytest 9 as pinned) and pytest-cov together.
        #     Dev/test-only dependency — never ships, no production exposure.
        #   - ecdsa 0.19.2 (PYSEC-2026-1325, transitive via
        #     python-jose[cryptography]): no fixed version exists upstream.
        #     This app signs JWTs with HS256 (symmetric) by default —
        #     see .env.example's JWT_ALGORITHM — so ecdsa's EC code path
        #     is pulled in but never actually exercised.
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-249 \
            --ignore-vuln PYSEC-2026-1941 \
            --ignore-vuln PYSEC-2026-1942 \
            --ignore-vuln PYSEC-2026-2280 \
            --ignore-vuln PYSEC-2026-2281 \
            --ignore-vuln PYSEC-2026-1845 \
            --ignore-vuln PYSEC-2026-1325

      - name: Run tests with coverage
        # Runs the full suite (unit + integration, Postgres/Redis services
        # above provide what tests/integration/conftest.py needs) — the
        # infrastructure/presentation layers that only integration tests can
        # reach (repositories, routers) are what push this past the ~86% the
        # unit-only suite gets locally. Raised from 60% to the Band 03 target
        # of 80% in Task #13, now that those integration tests exist for
        # every module (they didn't yet when 60% was set in Task #3).
        run: pytest --cov=app --cov-report=xml --cov-fail-under=80

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.0"
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage
