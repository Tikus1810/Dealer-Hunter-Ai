name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dealhunter
          POSTGRES_PASSWORD: dealhunter
          POSTGRES_DB: dealhunter
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dealhunter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://dealhunter:dealhunter@localhost:5432/dealhunter
      DATABASE_URL_SYNC: postgresql+psycopg2://dealhunter:dealhunter@localhost:5432/dealhunter
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-test-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app

      - name: Run tests with coverage
        # Coverage gate starts low because db/session.py, db/redis.py and the
        # module infrastructure/presentation layers are still empty scaffolding
        # (Task #3 "Datenbankschema" onward). Raised to the Band 03 target of
        # 80%+ once those layers have real integration tests (Task #13).
        run: pytest --cov=app --cov-report=xml --cov-fail-under=60

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.0"
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage
