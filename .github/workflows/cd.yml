name: CD

# Triggered by the CI workflow finishing on `main`, not by `push` directly —
# an image must never get built/pushed from a commit that hasn't passed
# lint/typecheck/tests. `workflow_run` also means a red CI run can't produce
# a green-looking CD run by accident (they're two different checks in the
# GitHub UI, but this keeps them causally linked instead of just co-incidentally
# both watching `main`).
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

jobs:
  build-and-push:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        run: |
          SHA_SHORT=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-12)
          # Docker registry/repository names must be lowercase — GitHub
          # usernames aren't (this repo's owner is "Tikus1810"), so
          # ${{ github.repository_owner }} used raw broke `docker buildx`
          # outright the first time this workflow actually pushed
          # ("repository name must be lowercase"), never caught before
          # since no CI run had ever gotten far enough to trigger CD.
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/$OWNER_LOWER/dealhunter-backend"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tags=$IMAGE:$SHA_SHORT,$IMAGE:latest" >> "$GITHUB_OUTPUT"

      # Build once, push once, tagged both with the immutable commit sha
      # (what docker-compose.prod.yml's IMAGE_TAG should normally pin to —
      # reproducible, and what a rollback re-points at) and `latest` (a
      # convenience pointer, not something a real rollback should rely on).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Pushed ${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
