name: deal_hunter_ai
description: >
  Deal Hunter AI — Flutter client for discovering, scoring and repair-analyzing
  second-hand tech deals (Windows laptops, MacBooks, iPhones, game consoles).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State management (Band 04: Riverpod, immutable state, UI/business-logic
  # separation). Pinned to the 2.x line rather than the newer 3.x major
  # release — 3.x rewrote core APIs (StateProvider moved to legacy.dart,
  # unified Notifier base class, ProviderException wrapping) shortly before
  # this was written, and this sandbox has no Flutter SDK/analyzer to verify
  # against it. 2.x is stable, extensively documented, and a contained
  # upgrade later.
  flutter_riverpod: ^2.6.1

  # Navigation (Band 04: go_router, deep-linking ready). Only the stable
  # imperative API (GoRouter/GoRoute/GoRouterState) is used — not the
  # codegen-based GoRouteData/TypedGoRoute surface, which changed more
  # across major versions.
  #
  # 16.1.0, not 17.4.0: every go_router >=16.2.0 requires Dart SDK
  # >=3.7.0, but CI pins Flutter 3.27.0 (bundles Dart 3.6.0) —
  # `flutter pub get` failed outright in CI (see the same note on
  # flutter_lints below). This exact pin is what `flutter pub get`'s own
  # resolver suggested when it failed — verified against the real tool,
  # not guessed against pub.dev docs like the other pins here, after an
  # earlier guess (17.1.3, believed compatible per pub.dev's published
  # per-version SDK constraints) turned out wrong in practice. Only the
  # stable imperative API above is used, present unchanged since well
  # before 13.x.
  go_router: ^16.1.0

  # REST client (Band 04: automatic token refresh, retry policy, central
  # error handling) — see lib/core/network/.
  dio: ^5.11.0

  # Encrypted on-device storage for JWT access/refresh tokens.
  #
  # 10.3.1, not 11.0.0: 11.x requires Dart SDK ^3.8.0, incompatible with
  # CI's Flutter 3.27.0 (Dart 3.6.0) — same story as go_router/flutter_lints
  # above. 10.3.1 requires only ^3.3.0. Only the bare default constructor
  # and read/write/delete (TokenStorage's entire surface, see
  # lib/core/network/token_storage.dart) are used — unchanged across 10.x/11.x.
  flutter_secure_storage: ^10.3.1

  # SF Symbols-style icon glyphs for the Apple-style redesign pass —
  # `CupertinoIcons` (the Dart class) ships inside the Flutter SDK itself,
  # but this package supplies the actual icon font asset it points at;
  # without it, CupertinoIcons.* render as empty glyphs. 1.0.8 only needs
  # Dart SDK >=2.12.0, well under CI's Flutter 3.27.0/Dart 3.6.0 floor —
  # no repeat of the go_router/flutter_secure_storage pin issue.
  cupertino_icons: ^1.0.8

  # Renders `assets/branding/wolf_howl.svg` (BrandMark, Band 19: Branding,
  # third design pass) — the exact scenario `BrandMark`'s own docstring
  # flagged as "revisit once the SVG asset is actually needed for more
  # than this": actual illustrative artwork, not a shape `Container`/
  # `Transform` can reasonably hand-draw. 2.2.1 needs only Dart SDK
  # >=3.4.0, satisfied by CI's Flutter 3.27.0 (Dart 3.6.0) — verified via
  # `flutter pub get`/`analyze`/`test` immediately after adding this, not
  # guessed from pub.dev's per-version metadata (see CLAUDE.md).
  flutter_svg: ^2.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # 5.0.0, not the latest (6.x): flutter_lints 6.x requires Dart SDK
  # ^3.8.0, but CI pins Flutter 3.27.0 (see .github/workflows/ci.yml),
  # which bundles Dart 3.6.0 — 6.x failed `flutter pub get` in CI outright
  # (the first real verification this repo's Flutter code ever got). 5.0.0
  # requires only ^3.5.0, satisfied by 3.6.0. Dev-only lint rules, zero
  # runtime impact either way.
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # `BrandMark`'s SVG mark (see the flutter_svg dependency note above)
  # plus the original placeholder `app_icon.svg` it was drawn from.
  assets:
    - assets/branding/wolf_howl.svg

  # Space Grotesk (Band 19: Branding, third design pass) — see
  # AppTypography.fontFamily's docstring for why a custom font wasn't
  # used before this and what changed. One variable-font file bound to
  # several `weight:` entries: Flutter reads the file's `wght` axis to
  # render each weight correctly, so this isn't five separate font files.
  # OFL-licensed (Google Fonts, `assets/fonts/space_grotesk/OFL.txt`),
  # free to bundle and redistribute.
  fonts:
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/space_grotesk/SpaceGrotesk-Variable.ttf
          weight: 300
        - asset: assets/fonts/space_grotesk/SpaceGrotesk-Variable.ttf
          weight: 400
        - asset: assets/fonts/space_grotesk/SpaceGrotesk-Variable.ttf
          weight: 500
        - asset: assets/fonts/space_grotesk/SpaceGrotesk-Variable.ttf
          weight: 600
        - asset: assets/fonts/space_grotesk/SpaceGrotesk-Variable.ttf
          weight: 700
